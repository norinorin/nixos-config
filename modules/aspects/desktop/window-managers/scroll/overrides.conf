for_window [shell="xwayland"] title_format "[XWayland] %title"
for_window [app_id="^osu!$"] allow_tearing yes; scratchpad_minimize_view false

# HDMI-A-1 (external monitor on dGPU)
# output HDMI-A-1 mode 1920x1080@60Hz position 0,0 scale 1
output HDMI-A-1 mode 1920x1080@180.003Hz position 0,0 scale 1

# HDMI-A-5 (same as above, but with iGPU enabled)
# output HDMI-A-5 mode 1920x1080@60Hz position 0,0 scale 1
output HDMI-A-5 mode 1920x1080@180.003Hz position 0,0 scale 1

# eDP-1 (internal display)
# output eDP-1 mode 1920x1080@60.001Hz position 1920,0 scale 1
output eDP-1 mode 1920x1080@144.001Hz position 1920,0 scale 1
